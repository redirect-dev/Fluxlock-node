[package]
name = "fluxlock-protocol"
version = "0.1.0"
edition = "2021"

[dependencies]
blake3 = "1"
ed25519-dalek = { version = "2", features = ["rand_core"] }
hex = "0.4"

# 🔐 Post-quantum crypto (Dilithium)
pqcrypto-dilithium = "0.5"
pqcrypto-traits = "0.3"

# 🎲 Random + utilities
rand = "0.8"
colored = "2"

# 🧠 Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"

# 🌐 Lightweight HTTP server (KEEP THIS)
tiny_http = "0.12"