[package]
name = "fluxlock-storage"
version = "0.1.0"
edition = "2021"

[dependencies]
rusqlite = { version = "0.31", features = ["bundled"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"

tokio = { version = "1", features = ["full"] }

once_cell = "1.19"
fluxlock-core = { path = "../fluxlock-core" }